<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <sp-heading>OKLCH Color</sp-heading>
  <label class="field">
    <span>Lightness (L)</span>
    <input id="lightness" type="number" min="0" max="1" step="0.01" value="0.7">
  </label>
  <label class="field">
    <span>Chroma (C)</span>
    <input id="chroma" type="number" min="0" max="0.4" step="0.01" value="0.15">
  </label>
  <label class="field">
    <span>Hue (H)</span>
    <input id="hue" type="number" min="0" max="360" step="1" value="250">
  </label>
  <div id="color-preview">
    <span id="preview-hex">#4BA3F7</span>
  </div>
  <sp-body id="oklch-value">oklch(0.7 0.15 250)</sp-body>
  <div id="conversion-result">
    <sp-body id="rgb-value"></sp-body>
    <sp-body id="hex-value"></sp-body>
    <sp-body id="gamut-value"></sp-body>
  </div>
  <div id="foreground-actions">
    <sp-button id="set-foreground">Set Foreground Color</sp-button>
    <sp-body id="foreground-status"></sp-body>
  </div>
  <script src="main.js"></script>
</body>
</html>
